services:
  # 1. قاعدة البيانات (استخدام صورة alpine المستقرة)
 # 1. قاعدة البيانات
  postgres:
    image: postgres:15-alpine
    container_name: qafza_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: olist_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d olist_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. تطبيق FastAPI
  api:
    build: .
    container_name: olist_mlops_api
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m src.train &&
             python -m src.evidently_report &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
  # 3. واجهة MLflow UI
  mlflow:
    build: .
    container_name: olist_mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    ports:
      - "5000:5000"

  # 4. واجهة Evidently UI
  evidently:
    build: .
    container_name: olist_evidently
    command: evidently ui --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
