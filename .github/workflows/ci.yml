name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx scikit-learn numpy


      - name: Create Dummy Models for CI
        run: |
          mkdir -p models
          python -c "
          import pickle, os
          import pandas as pd
          import numpy as np
          from sklearn.dummy import DummyClassifier
          from sklearn.preprocessing import StandardScaler
          from sklearn.compose import ColumnTransformer
          from sklearn.onehot import OneHotEncoder

          # إعداد بيانات وهمية تطابق حقول الـ API
          data = pd.DataFrame([{
              'total_price': 100.0,
              'total_freight': 20.0,
              'total_items': 1,
              'total_payment': 120.0,
              'max_installments': 1,
              'order_status': 'delivered',
              'customer_state': 'SP'
          }])

          num_cols = ['total_price', 'total_freight', 'total_items', 'total_payment', 'max_installments']
          cat_cols = ['order_status', 'customer_state']

          if not os.path.exists('models/preprocessor.pkl'):
              prep = ColumnTransformer([
                  ('num', StandardScaler(), num_cols),
                  ('cat', OneHotEncoder(handle_unknown='ignore'), cat_cols)
              ])
              X_trans = prep.fit_transform(data)
              with open('models/preprocessor.pkl', 'wb') as f:
                  pickle.dump(prep, f)
          else:
              with open('models/preprocessor.pkl', 'rb') as f:
                  prep = pickle.load(f)
              X_trans = prep.transform(data)

          if not os.path.exists('models/model.pkl'):
              model = DummyClassifier().fit(X_trans, [1])
              with open('models/model.pkl', 'wb') as f:
                  pickle.dump(model, f)
          "