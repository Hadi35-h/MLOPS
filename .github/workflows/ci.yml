name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx scikit-learn numpy

      - name: Create Dummy Models for CI
        run: |
          mkdir -p models
          python -c "
          import pickle, os
          import numpy as np
          from sklearn.dummy import DummyClassifier
          from sklearn.preprocessing import StandardScaler

          X = np.array([[100.0, 20.0, 1, 120.0, 1], [200.0, 40.0, 2, 240.0, 2]])
          y = np.array([0, 1])

          if not os.path.exists('models/model.pkl'):
              model = DummyClassifier().fit(X, y)
              with open('models/model.pkl', 'wb') as f:
                  pickle.dump(model, f)

          if not os.path.exists('models/preprocessor.pkl'):
              prep = StandardScaler().fit(X)
              with open('models/preprocessor.pkl', 'wb') as f:
                  pickle.dump(prep, f)
          "

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: olist_mlops_api:latest