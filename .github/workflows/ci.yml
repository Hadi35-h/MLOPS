# 4. إنشاء نماذج مؤقتة جاهزة للاستخدام في بيئة CI
      - name: Create Dummy Models for CI
        run: |
          mkdir -p models
          python -c "
          import pickle, os
          import numpy as np
          from sklearn.dummy import DummyClassifier
          from sklearn.preprocessing import StandardScaler

          # بيانات وهمية لتكييف الـ Scaler والـ Model
          X = np.array([[100.0, 20.0, 1, 120.0, 1], [200.0, 40.0, 2, 240.0, 2]])
          y = np.array([0, 1])

          if not os.path.exists('models/model.pkl'):
              model = DummyClassifier().fit(X, y)
              with open('models/model.pkl', 'wb') as f:
                  pickle.dump(model, f)

          if not os.path.exists('models/preprocessor.pkl'):
              prep = StandardScaler().fit(X)
              with open('models/preprocessor.pkl', 'wb') as f:
                  pickle.dump(prep, f)
          "