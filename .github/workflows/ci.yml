name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies and required libraries
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx scikit-learn numpy pandas

      # 4. Create dummy models with matching dimensions to avoid 500 error in test environment
      - name: Create Dummy Models for CI
        run: |
          mkdir -p models
          python -c "
          import pickle, os
          import pandas as pd
          import numpy as np
          from sklearn.dummy import DummyClassifier
          from sklearn.preprocessing import StandardScaler, OneHotEncoder
          from sklearn.compose import ColumnTransformer

          # Prepare dummy data matching all API input columns
          data = pd.DataFrame([{
              'total_price': 100.0,
              'total_freight': 20.0,
              'total_items': 1,
              'total_payment': 120.0,
              'max_installments': 1,
              'order_status': 'delivered',
              'customer_state': 'SP'
          }])

          num_cols = ['total_price', 'total_freight', 'total_items', 'total_payment', 'max_installments']
          cat_cols = ['order_status', 'customer_state']

          # Create and fit the Preprocessor
          prep = ColumnTransformer([
              ('num', StandardScaler(), num_cols),
              ('cat', OneHotEncoder(handle_unknown='ignore'), cat_cols)
          ])
          X_trans = prep.fit_transform(data)

          with open('models/preprocessor.pkl', 'wb') as f:
              pickle.dump(prep, f)

          # Create a dummy model matching the output dimensions of the Preprocessor
          model = DummyClassifier().fit(X_trans, [1])
          with open('models/model.pkl', 'wb') as f:
              pickle.dump(model, f)
          "

      # 5. Run unit tests via pytest
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/

      # 6. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Build Docker image to verify its integrity
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: olist_mlops_api:latest
      - name: Run Data Quality Check (Great Expectations)
        run: |
         python validate_data.py
